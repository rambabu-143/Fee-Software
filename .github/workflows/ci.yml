name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fees
          POSTGRES_PASSWORD: fees
          POSTGRES_DB: fees
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fees" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fees:fees@localhost:5432/fees?schema=public
      JWT_SECRET: ci-only-secret-not-for-deploys
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # One file at a time: every spec boots its own app and the suites share one database.
      - run: npm run test:e2e -- --no-file-parallelism

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
